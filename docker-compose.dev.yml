services:
  capcutapi:
    # 本地开发环境配置 - 使用本地构建
    build:
      context: .
      dockerfile: Dockerfile

    container_name: capcutapi-dev

    # 端口映射
    ports:
      - "9000:9000"

    # 卷挂载（持久化数据）
    volumes:
      # 配置文件
      - ./config.json:/app/config.json:ro
      - ./path_config.json:/app/path_config.json:ro

      # 数据库文件
      - ./capcut.db:/app/capcut.db
      - ./drafts.db:/app/drafts.db

      # 日志目录
      - ./logs:/app/logs

      # 数据目录（可选）
      - ./data:/app/data

      # Pattern 模板（如果需要动态更新）
      - ./pattern:/app/pattern:ro

      # 开发模式：挂载源代码以支持热重载
      - ./capcut_server.py:/app/capcut_server.py
      - ./pyJianYingDraft:/app/pyJianYingDraft

    # 环境变量（优先使用 .env 文件或在此定义）
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=1

    # 环境变量文件（推荐方式）
    env_file:
      - .env

    # 重启策略
    restart: unless-stopped

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/get_intro_animation_types"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # 网络模式
    network_mode: bridge

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
